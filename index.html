<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6F0">
  <title>暖巷咖啡 · 扫码点单</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 菜单页 -->
    <section id="page-menu" class="page page--active">
      <header id="header" class="header"></header>
      <main id="product-list" class="product-list"></main>
      <div id="cart-bar" class="cart-bar"></div>
      <div id="cart-popup-mask" class="cart-popup__mask hidden"></div>
      <div id="cart-popup" class="cart-popup hidden"></div>
    </section>

    <!-- 订单确认页 -->
    <section id="page-order" class="page">
      <div id="order-content"></div>
    </section>
  </div>

  <div id="fly-to-cart" class="fly-ball hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/components/cartBar.js"></script>
  <script src="js/components/cartPopup.js"></script>
  <script src="js/pages/menuPage.js"></script>
  <script src="js/pages/orderConfirmPage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
